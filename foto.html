        <button class="burger-menu" type="button" aria-label="Navigacija">

      <main class="foto-prostor">
        <section class="foto-uvod">
          <blockquote class="foto-citat">for moments captured in time</blockquote>

        <section class="foto-galerija">
          <figure class="foto-stavka"><img src="media/foto1.jpg" alt="Vijadukt iznad jezera okružen prirodom- pejzažna fotografija" /></figure>
          <figure class="foto-stavka"><img src="media/foto2.jpg" alt="Dva stolca i stolić uz staklenu stjenu s pogledom na eksterijer- fotografija interijera" /></figure>
          <figure class="foto-stavka"><img src="media/foto3.jpg" alt="Pročelje zgrade obasjane suncem" /></figure>

          <figure class="foto-stavka"><img src="media/foto5.jpg" alt="Par sjedi na obali jezera uz šumovitu stazu" /></figure>
          <figure class="foto-stavka"><img src="media/foto6.jpg" alt="Crveni stolci i stolovi u modernom interijeru" /></figure>

          <figure class="foto-stavka"><img src="media/foto11.jpg" alt="Velika kružna viseća instalacija iznad stolova i stolica u tamnom interijeru" /></figure>
          <figure class="foto-stavka"><img src="media/foto12.jpg" alt="Livada okružena zelenim brdima pod plavim nebom" /></figure>
        </section>
      </main>
    </div>
    <script src="menu.js"></script>
